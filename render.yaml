services:
  - type: web
    name: sentinel-ai-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: oregon
    branch: main
    healthCheckPath: /api/system/health
    envVars:
      - key: PORT
        value: 8000
      - key: CCTV_DATA_DIR
        value: /app/data
      - key: CCTV_MAX_SAMPLE_FRAMES
        value: 180
      - key: CCTV_SAMPLE_FPS
        value: 1
      - key: HF_HUB_DISABLE_XET
        value: 1
      - key: PYTHONUNBUFFERED
        value: 1
      - key: CORS_ORIGINS
        value: "*"
    disk:
      name: sentinel-data
      mountPath: /app/data
      sizeGB: 10
